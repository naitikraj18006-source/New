name: Ramu APK banao

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: APK build karo
        run: |
          S=$(find . -name settings.gradle.kts -not -path "*/node_modules/*" | head -1)
          if [ -z "$S" ]; then
            echo "settings.gradle.kts repository mein nahi mili. Project ki files upload karo."
            ls -R
            exit 1
          fi
          cd "$(dirname "$S")"
          gradle :app:assembleRelease --no-daemon --stacktrace
      - name: APK upload karo
        uses: actions/upload-artifact@v4
        with:
          name: Ramu-apk
          path: "**/build/outputs/apk/release/*.apk"
